[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oss-ready"
version = "0.1.0"
description = "A small CLI that checks whether a repository is ready to publish as open source."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Samuel Wilcox" }
]
keywords = ["open-source", "cli", "repository", "markdown", "readiness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup :: Markdown"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ProfessorZon/oss-ready"
Issues = "https://github.com/ProfessorZon/oss-ready/issues"

[project.scripts]
oss-ready = "oss_ready.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_ready"]
